# 实验配置：召回(ItemCF/UserCF) + 精排(DeepFM)

# 数据配置
data:
  raw_data_path: "data/raw"
  processed_data_path: "data/processed"
  feature_data_path: "data/features"
  kuairand_path: "E:/data/KuaiRand-1K/data"
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

# 召回配置 (仅保留协同过滤)
recall:
  channels:
    - name: "item_cf"
      weight: 0.6
      top_k: 200
    - name: "user_cf"
      weight: 0.4
      top_k: 200
  
  total_recall_num: 300

# 精排配置 (DeepFM)
ranking:
  model_type: "deepfm"
  top_k: 50
  
  # DeepFM 模型配置
  deepfm:
    dnn_hidden_units: [256, 128, 64]
    embedding_dim: 16
    batch_size: 1024
    learning_rate: 0.001
    epochs: 10
    dropout: 0.2
    max_train_rows: 500000

# 评估配置
evaluation:
  metrics:
    - auc
    - gauc
    - recall@50
  offline:
    test_size: 50000
